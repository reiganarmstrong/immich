#
# Immich Docker Compose configuration
#
# Based on the official current release template:
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}

    # Intel Arc hardware transcoding
    extends:
      file: hwaccel.transcoding.yml
      service: quicksync

    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro

    env_file:
      - .env

    ports:
      - "2283:2283"

    depends_on:
      - redis
      - database

    restart: always

    healthcheck:
      disable: false

    stop_grace_period: 10m


  immich-machine-learning:
    container_name: immich_machine_learning

    # Intel Arc OpenVINO machine-learning acceleration
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino

    extends:
      file: hwaccel.ml.yml
      service: openvino

    volumes:
      - model-cache:/cache

    env_file:
      - .env

    restart: always

    healthcheck:
      disable: false

    stop_grace_period: 10m


  redis:
    container_name: immich_redis

    image: >-
      docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9

    healthcheck:
      test: redis-cli ping || exit 1

    restart: always

  database:
    container_name: immich_postgres

    image: >-
      ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23

    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"

      # Uncomment only if DB_DATA_LOCATION is stored on an HDD.
      # DB_STORAGE_TYPE: "HDD"

    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data

    shm_size: 128mb

    restart: always

    healthcheck:
      disable: false

    stop_grace_period: 10m


volumes:
  model-cache:
